name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --locked --extra dev python -m pytest
      - name: Lint
        run: uv run --locked --extra dev python -m ruff check .
      - name: Format
        run: uv run --locked --extra dev python -m ruff format --check .
      - name: Check public demo matches the app
        run: uv run --locked --extra dev python scripts/build_demo.py --check

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dashboard test dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test dashboard behavior
        run: npm test

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [python, dashboard]
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            if (!Object.keys(jobs).length || Object.values(jobs).some(job => job.result !== "success")) {
              console.error("All required validation jobs must succeed.", jobs);
              process.exit(1);
            }
          '
