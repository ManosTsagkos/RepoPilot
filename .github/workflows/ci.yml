name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run --locked --extra dev python -m pytest
      - name: Lint
        run: uv run --locked --extra dev python -m ruff check .
      - name: Format
        run: uv run --locked --extra dev python -m ruff format --check .
      - name: Check public demo matches the app
        run: uv run --locked --extra dev python scripts/build_demo.py --check

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dashboard test dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test dashboard behavior
        run: npm test

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [python, dashboard]
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            if (!Object.keys(jobs).length || Object.values(jobs).some(job => job.result !== "success")) {
              console.error("All required validation jobs must succeed.", jobs);
              process.exit(1);
            }
          '
